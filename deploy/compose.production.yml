name: usage-metering-production

x-backend: &backend
  image: usage-metering-backend:production
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - backend.env
  volumes:
    - ./certificates/ca.pem:/run/certificates/ca.pem:ro

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      POSTGRES_USER: metering
      POSTGRES_DB: usage_metering
    entrypoint:
      - /bin/sh
      - /opt/postgres/start.sh
    volumes:
      - production_data:/var/lib/postgresql/data
      - ./postgres/start.sh:/opt/postgres/start.sh:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certificates/database.pem:/run/certificates/database.pem:ro
      - ./certificates/database.key:/run/certificates/database.key:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d usage_metering"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["node", "--import", "tsx", "scripts/migrations/run.ts"]
    restart: "no"
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    networks:
      - database
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  consumer:
    <<: *backend
    command: ["node", "--import", "tsx", "src/infrastructure/events/run-consumer.ts"]
    restart: unless-stopped
    stop_grace_period: 75s
    networks:
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: usage-metering-frontend:production
    build:
      context: ../web
      dockerfile: Dockerfile
    env_file:
      - frontend.env
    restart: unless-stopped
    volumes:
      - ./certificates/ca.pem:/run/certificates/ca.pem:ro
    networks:
      database:
      frontend:
        ipv4_address: 172.30.242.20
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./certificates/ingress.pem:/run/certificates/ingress.pem:ro
      - ./certificates/ingress.key:/run/certificates/ingress.key:ro
    networks:
      ingress:
      backend:
        ipv4_address: 172.30.241.10
      frontend:
        ipv4_address: 172.30.242.10
        aliases:
          - internal.metering.test
    depends_on:
      - frontend
      - api

networks:
  ingress:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.241.0/24
  frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.242.0/24
  database:
    internal: true

volumes:
  production_data:
