worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    client_max_body_size 16k;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/certificates/ingress.pem;
    ssl_certificate_key /run/certificates/ingress.key;

    ssl_session_tickets off;

    log_format safe '$remote_addr $request_method '
                    '$status $body_bytes_sent $request_time';

    access_log /dev/stdout safe;
    error_log /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name app.metering.test api.metering.test;
        return 308 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 443 ssl;
        server_name app.metering.test;

        location / {
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://frontend:3000;
        }
    }

    server {
        listen 443 ssl;
        server_name api.metering.test;

        location = /health {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/health;
        }

        location = /ready {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/ready;
        }

        location = /plans {
            limit_except GET POST { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/plans;
        }

        location = /account {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/account;
        }

        location = /users {
            limit_except GET POST { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/users;
        }

        location = /consume {
            limit_except POST { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/consume;
        }

        location = /usage/history {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/usage/history;
        }

        location = /usage/monthly {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/usage/monthly;
        }

        location = /notifications {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/notifications;
        }

        location = /plans/custom {
            limit_except GET { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/plans/custom;
        }

        location = /accounts/plan {
            limit_except PATCH { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/accounts/plan;
        }

        location = /users/plan {
            limit_except PATCH { deny all; }
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000/users/plan;
        }

        location ~ ^/plans/[0-9]+$ {
            limit_except PATCH { deny all; }
            include /etc/nginx/proxy-headers.conf;
            rewrite ^ $uri break;
            proxy_pass http://api:3000;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 172.30.242.10:8443 ssl default_server;
        allow 172.30.242.20;
        deny all;
        server_name internal.metering.test;

        if ($host != internal.metering.test) {
            return 444;
        }

        location / {
            include /etc/nginx/proxy-headers.conf;
            proxy_pass http://api:3000;
        }
    }
}
