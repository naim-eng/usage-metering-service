services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering_dev_password
      POSTGRES_DB: usage_metering
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
