services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usage_metering
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./sql/002_seed_plans.sql:/docker-entrypoint-initdb.d/002_seed_plans.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
