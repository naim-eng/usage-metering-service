
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usage_metering
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["npx", "tsx", "scripts/migrations/run.ts"]
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumer:
    build: .
    command: ["npm", "run", "consumer"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - events

  demo-db:
    image: postgres:17
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usage_metering_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d usage_metering_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - demo

  demo-migrate:
    build: .
    command: ["npx", "tsx", "scripts/migrations/run.ts"]
    restart: "no"
    environment:
      DB_HOST: demo-db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering_demo
    depends_on:
      demo-db:
        condition: service_healthy
    profiles:
      - demo

  demo-api:
    build: .
    environment:
      DB_HOST: demo-db
      DB_PORT: 5432
      DB_USER: metering
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: usage_metering_demo
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      demo-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    profiles:
      - demo

  demo-client:
    build: .
    command: ["npx", "tsx", "examples/demo-client.ts"]
    environment:
      API_BASE_URL: http://demo-api:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    depends_on:
      demo-api:
        condition: service_healthy
    profiles:
      - demo

volumes:
  postgres_data:
  demo_postgres_data:
